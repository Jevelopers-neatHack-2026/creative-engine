name: Standalone contract checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    name: contracts / Node ${{ matrix.node-version }} / Linux x64
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.23.3
          - 24.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts --offline
      - run: npm ci --prefix examples/frontend-action-roundtrip
      - run: node examples/frontend-action-roundtrip/node_modules/typescript/bin/tsc --version
      - run: make typecheck-contracts
      - run: make check TARGET=all MODE=mock
